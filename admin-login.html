<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Admin Log In · Cronyism Sports Syndicate</title>
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body class="theme-dark">
  <div class="page">
    <header class="header">
      <a class="brand" href="index.html">
        <p class="brand__name">CRONYISM</p>
        <p class="brand__tagline">SPORTS SYNDICATE</p>
      </a>
      <button class="icon-btn" id="menu-open" type="button" aria-label="Open menu" aria-controls="menu-drawer" aria-expanded="false">
        <img src="assets/icons/menu.svg" width="24" height="24" alt="" />
      </button>
    </header>

    <main class="auth">
      <h1 class="auth__title">Admin<br />Log In</h1>
      <form class="auth__form" id="admin-login-form">
        <div class="auth__fields">
          <label class="visually-hidden" for="email">Email</label>
          <input class="auth__input" id="email" name="email" type="email" placeholder="Email" autocomplete="username" required />
          <label class="visually-hidden" for="password">Password</label>
          <input class="auth__input" id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
        </div>
        <div class="auth__actions">
          <button class="auth__submit" type="submit">Log in</button>
          <a class="auth__link" href="#">Forgot Password</a>
        </div>
      </form>
    </main>
  </div>

  <script src="menu.js?v=3"></script>
  <script src="admin-login.js?v=3"></script>
</body>
</html>
